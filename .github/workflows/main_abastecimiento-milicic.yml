name: Build and deploy Node.js app to Azure Web App - abastecimiento-milicic

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Descarga directo tus archivos del repositorio (incluyendo los CSV nuevos)
      - uses: actions/checkout@v4

      # 2. Sube los archivos directo a producción usando el Perfil de Publicación
      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'abastecimiento-milicic'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: . # Sube la raíz directamente
